<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Palettez – Colors from any photo</title>
<script src="./dc-lite.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#151515}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #EFE9DF; color: #151515; font-family: Figtree, system-ui, sans-serif; overflow: hidden">

  <section role="img" aria-label="A sunset photo with its six extracted colors" style="position: absolute; left: 0; right: 0; top: 0; height: 450px; background: #E2603F; border-radius: 0 0 36px 36px; overflow: hidden">
    <div aria-hidden="true" style="position: absolute; left: -10px; top: 26px; font-family: Anton, Impact, sans-serif; font-size: 150px; line-height: 140px; color: rgba(21,21,21,0.12); white-space: nowrap; letter-spacing: 2px">COLOR<br>COLOR</div>

    <div style="position: absolute; left: 70px; top: 96px; width: 250px; height: 200px; border-radius: 26px; overflow: hidden; background: #F6E7CB; transform: rotate(-4deg); box-shadow: 0 18px 40px rgba(21,21,21,0.28)">
      <div style="position: absolute; left: 150px; top: 24px; width: 80px; height: 80px; border-radius: 50%; background: #F2A65A"></div>
      <div style="position: absolute; left: -40px; top: 92px; width: 240px; height: 110px; border-radius: 50%; background: #E4572E"></div>
      <div style="position: absolute; left: 110px; top: 104px; width: 260px; height: 120px; border-radius: 50%; background: #8C5383"></div>
      <div style="position: absolute; left: 0; top: 148px; width: 100%; height: 18px; background: #1B998B"></div>
      <div style="position: absolute; left: 0; top: 166px; width: 100%; height: 34px; background: #2E4057"></div>
    </div>

    <div style="position: absolute; left: 34px; right: 34px; top: 318px; display: flex; justify-content: space-between">
      <span style="width: 46px; height: 46px; border-radius: 50%; background: #F6E7CB; box-shadow: 0 0 0 4px rgba(255,255,255,0.35)"></span>
      <span style="width: 46px; height: 46px; border-radius: 50%; background: #E4572E; box-shadow: 0 0 0 4px rgba(255,255,255,0.35)"></span>
      <span style="width: 46px; height: 46px; border-radius: 50%; background: #8C5383; box-shadow: 0 0 0 4px rgba(255,255,255,0.35)"></span>
      <span style="width: 46px; height: 46px; border-radius: 50%; background: #F2A65A; box-shadow: 0 0 0 4px rgba(255,255,255,0.35)"></span>
      <span style="width: 46px; height: 46px; border-radius: 50%; background: #2E4057; box-shadow: 0 0 0 4px rgba(255,255,255,0.35)"></span>
      <span style="width: 46px; height: 46px; border-radius: 50%; background: #1B998B; box-shadow: 0 0 0 4px rgba(255,255,255,0.35)"></span>
    </div>

    <span style="position: absolute; left: 50%; top: 386px; transform: translateX(-50%); height: 40px; padding: 0 16px; border-radius: 20px; background: #151515; color: #FFFFFF; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; white-space: nowrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A7D86E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
      Copied #E4572E
    </span>
  </section>

  <div style="position: absolute; left: 24px; right: 24px; bottom: 32px; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 46px; line-height: 50px; letter-spacing: 0.5px">COLORS FROM<br>ANY PHOTO</h1>
    <p style="margin: 0; font-size: 16px; line-height: 23px; color: #4A453E">Pick a photo or snap one. Palettez finds its main colors and gives you HEX, RGB and CMYK values to copy with one tap.</p>
    <p style="margin: 0; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 18px; background: #FBF8F3; font-size: 14px; line-height: 19px; font-weight: 600">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      Your images never leave your phone.
    </p>
    <div style="display: flex; gap: 6px; margin: 4px 0" aria-label="Step 2 of 3" role="img">
      <span style="width: 8px; height: 8px; border-radius: 4px; background: #CFC6B8"></span>
      <span style="width: 28px; height: 8px; border-radius: 4px; background: #151515"></span>
      <span style="width: 8px; height: 8px; border-radius: 4px; background: #CFC6B8"></span>
    </div>
    <div style="display: flex; gap: 10px">
      <a href="Onboarding1.html" aria-label="Back" style="width: 60px; height: 60px; flex: none; border-radius: 50%; background: #FBF8F3; color: #151515; display: flex; align-items: center; justify-content: center">

      </a>
      <a href="Onboarding3.html" style="flex: 1; height: 60px; border-radius: 30px; background: #151515; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font: 400 22px/28px Anton, Impact, sans-serif; letter-spacing: 0.8px; text-decoration: none">
        NEXT
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
    </div>
  </div>
</div>
</x-dc>

</html>

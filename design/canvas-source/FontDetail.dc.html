<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Palettez – Font detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Figtree:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#A7D86E}a:hover{color:#C4EB92}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #1D2320; color: #FFFFFF; font-family: Figtree, system-ui, sans-serif; overflow: hidden">

  <main style="position: absolute; inset: 0; overflow-y: auto">
    <section aria-label="Specimen" style="position: relative; height: 330px; background: #A7D86E; overflow: hidden">
      <div aria-hidden="true" style="position: absolute; left: -14px; top: 40px; font-family: 'Playfair Display', serif; font-weight: 900; font-style: italic; font-size: 132px; line-height: 118px; color: rgba(21,21,21,0.09); white-space: nowrap">Playfair<br>Display</div>
      <div style="position: absolute; left: 0; right: 0; top: 76px; display: flex; justify-content: center; align-items: baseline; gap: 10px; color: #151515">
        <span style="font-family: 'Playfair Display', serif; font-weight: 700; font-size: 168px; line-height: 180px">Aa</span>
        <span style="font-family: 'Playfair Display', serif; font-weight: 400; font-style: italic; font-size: 76px; line-height: 80px">g&amp;</span>
      </div>
    </section>

    <section aria-label="Playfair Display" style="padding: 22px 20px 120px; display: flex; flex-direction: column; gap: 16px">
      <div>
        <p style="margin: 0 0 6px; display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 18px; font-weight: 600; color: #C9CEC9">
          <span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 50%; background: #A7D86E; display: inline-block"></span>
          Google Fonts
        </p>
        <div style="display: flex; align-items: flex-start; gap: 12px">
          <h1 style="flex: 1; margin: 0; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 40px; line-height: 44px; letter-spacing: 0.5px">PLAYFAIR DISPLAY</h1>
          <span style="font-family: Anton, Impact, sans-serif; font-size: 30px; line-height: 44px; color: #A7D86E">FREE</span>
        </div>
        <p style="margin: 6px 0 0; font-size: 14px; line-height: 20px; color: #C9CEC9">Serif · designed by Claus Eggers Sørensen</p>
      </div>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <div style="background: #2A312D; border-radius: 20px; padding: 14px 16px">
          <p style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 700">12 styles</p>
          <p style="margin: 2px 0 0; font-size: 13px; line-height: 18px; color: #C9CEC9">400–900, with italics</p>
        </div>
        <div style="background: #2A312D; border-radius: 20px; padding: 14px 16px">
          <p style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 700">Open source</p>
          <p style="margin: 2px 0 0; font-size: 13px; line-height: 18px; color: #C9CEC9">SIL Open Font License</p>
        </div>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{actions}}" as="a" hint-placeholder-count="3">
          <button type="button" onClick="{{a.run}}" style="height: 44px; padding: 0 16px; border: 0; border-radius: 22px; background: #2A312D; color: #FFFFFF; font: 600 14px/20px Figtree, sans-serif; cursor: pointer">{{a.label}}</button>
        </sc-for>
      </div>

      <h2 style="margin: 6px 0 0; font-family: Anton, Impact, sans-serif; font-weight: 400; font-size: 24px; line-height: 30px; letter-spacing: 0.3px">STYLES</h2>
      <div>
        <sc-for list="{{styles}}" as="s" hint-placeholder-count="4">
          <div style="border-top: 1px solid #343C37; padding: 8px 0 14px">
            <div style="display: flex; align-items: center">
              <span style="flex: 1; font-size: 13px; line-height: 18px; font-weight: 600; color: #C9CEC9">{{s.label}}</span>
              <button type="button" aria-label="{{s.aria}}" onClick="{{s.save}}" style="width: 44px; height: 44px; border: 0; border-radius: 50%; background: #2A312D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>
              </button>
            </div>
            <p style="{{s.previewStyle}}">Sphinx of black quartz, judge my vow</p>
          </div>
        </sc-for>
      </div>
      <a href="https://fonts.google.com/specimen/Playfair+Display" style="font-size: 15px; line-height: 20px; font-weight: 600">Open on Google Fonts ↗</a>
    </section>
  </main>

  <a href="Fonts.dc.html" aria-label="Back to fonts" style="position: absolute; left: 16px; top: 16px; width: 48px; height: 48px; border-radius: 50%; background: #151515; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>
  </a>
  <button type="button" aria-label="Copy embed link" onClick="{{copyLink}}" style="position: absolute; right: 16px; top: 16px; width: 48px; height: 48px; border: 0; border-radius: 50%; background: #151515; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"></path><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"></path></svg>
  </button>

  <sc-if value="{{toast}}" hint-placeholder-val="{{false}}">
    <div role="status" style="position: absolute; left: 24px; right: 24px; bottom: 100px; padding: 13px 18px; border-radius: 22px; background: #FBF8F3; color: #151515; font-size: 14px; line-height: 20px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,0.35)">{{toast}}</div>
  </sc-if>

  <button type="button" onClick="{{saveAll}}" style="position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); height: 60px; padding: 0 40px; border: 0; border-radius: 30px; background: #A7D86E; color: #151515; font: 400 24px/30px Anton, Impact, sans-serif; letter-spacing: 0.8px; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.4); white-space: nowrap">SAVE .TTF FILES</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var LINK = '<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">';
var CSS = 'font-family: "Playfair Display", serif;';
var NAMES = { 400: 'Regular', 500: 'Medium', 600: 'SemiBold', 700: 'Bold', 800: 'ExtraBold', 900: 'Black' };

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { toast: '' }; }
  componentWillUnmount() { clearTimeout(this.t); }
  say(msg) { var self = this; this.setState({ toast: msg }); clearTimeout(this.t); this.t = setTimeout(function () { self.setState({ toast: '' }); }, 1800); }
  copy(text, what) { try { if (navigator.clipboard) navigator.clipboard.writeText(text).catch(function () {}); } catch (e) {} this.say(what + ' copied'); }
  renderVals() {
    var self = this, styles = [];
    [false, true].forEach(function (it) {
      [400, 500, 600, 700, 800, 900].forEach(function (w) {
        var label = NAMES[w] + (it ? ' Italic' : '') + ' · ' + w;
        styles.push({
          label: label, aria: 'Save ' + NAMES[w] + (it ? ' Italic' : '') + ' as .ttf',
          save: function () { self.say('PlayfairDisplay-' + NAMES[w] + (it ? 'Italic' : '') + '.ttf saved'); },
          previewStyle: "margin: 4px 0 0; font-family: 'Playfair Display', serif; font-size: 28px; line-height: 34px; font-weight: " + w + '; font-style: ' + (it ? 'italic' : 'normal')
        });
      });
    });
    return {
      styles: styles, toast: this.state.toast,
      copyLink: function () { self.copy(LINK, 'HTML link'); },
      saveAll: function () { self.say('12 font files saved'); },
      actions: [
        { label: 'Copy <link>', run: function () { self.copy(LINK, 'HTML link'); } },
        { label: 'Copy CSS', run: function () { self.copy(CSS, 'CSS'); } },
        { label: 'Copy name', run: function () { self.copy('Playfair Display', 'Name'); } }
      ]
    };
  }
}
</script>
</body>
</html>
